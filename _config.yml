title: ZeroDark
description: A high-contrast, professional Jekyll theme optimized for technical documentation.
logo_text: ZERODARK
logo_subtext: SP
copyright: "© 2026 ZeroDark Systems. All rights reserved."

# Repository Settings
repository:
  platform: github # options: github, gitlab, bitbucket, codeberg
  user: staticcanvas
  repo: zero-dark-sp
  branch: main
  edit_mode: standard # options: standard, vscode

theme_settings:
  logo:
    path: /assets/img/logo.svg
    height: 32px
    layout: inline # options: inline, stacked, split
  scroll_progress: true

  # Search Configuration
  search:
    provider: pagefind            # options: pagefind, lyra, algolia
    use_cdn: true                 # load search library assets via CDN vs local files
    algolia:
      app_id: "your_app_id"
      api_key: "your_search_only_api_key"
      index_name: "your_index_name"
  
  # Animations Controls
  animations:
    enabled: true                   # Enable/disable all animations globally
    page_loads: true                # Enable subtle page load fade-in animations
    hover_effects: true             # Enable hover scale/rotate micro-animations on interactive elements
  
  # Typography Configurations
  typography:
    google_fonts: "Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500|IBM+Plex+Sans:wght@500"
    font_sans: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font_mono: "'MonaspiceAr Nerd Font Mono', 'JetBrains Mono', 'Fira Code', monospace"
    h1:
      font_family: "'Fraunces', serif"
      weight: "400"
    h2:
      font_family: "'Fraunces', serif"
      weight: "500"
    h3:
      font_family: "'IBM Plex Sans', sans-serif"
      weight: "500"
    body:
      weight: "400"

  # Dynamic Footer Layout (2 or 3 columns)
  footer:
    columns:
      - title: "Documentation"
        items:
          - type: link
            text: "Introduction"
            url: "/"
            icon: "home"
          - type: link
            text: "Installation"
            url: "/installation/"
            icon: "download"
          - type: link
            text: "Advanced Installation"
            url: "/installation/advanced/"
            icon: "settings"
      - title: "Components"
        items:
          - type: link
            text: "Gallery"
            url: "/components/"
            icon: "package"
          - type: link
            text: "Liquid IRL"
            url: "/liquid-irl/"
            icon: "code"
          - type: link
            text: "Theme Colors"
            url: "/theme-colors/"
            icon: "palette"
      - title: "Project"
        items:
          - type: text
            text: "Zero-Dark is an elegant Jekyll theme designed for technical documentations and developers."
          - type: icon
            icon: "github"
            url: "https://github.com/staticcanvas"
          - type: icon
            icon: "linkedin"
            url: "https://linkedin.com/in/staticcanvas"

# Social
github_username: staticcanvas
twitter_username: staticcanvas
linkedin_username: staticcanvas

# Theme Features
zd_output_title_default: true
zd_toc_default_open: true
zd_progress_bar: true
zd_code_copy: true
zd_code_lang: true

# Defaults
zd_icon_size: 16
zd_toc_levels: ["h2", "h3", "h4"]
zd_debug: true
zd_show_version: true
version: 1.16.6
zd_accent_color: "#00ff9d"
zd_nav_spacing: compact
zd_show_powered_by: true
zd_use_cdn: true
font_awesome: false

# Announcement Banner Settings
zd_announcement:
  enabled: true
  id: "welcome-banner-v1"
  text: "Welcome to ZeroDark SP! Check out the new Keyboard Shortcuts component."
  icon: "megaphone"
  color: "var(--zd-clr-viridian)"
  link: "/components/kbd/"
  link_text: "View Docs"
  dismissible: true
  type: "success"

# Feedback Widget Settings
zd_feedback:
  enabled: true
  question: "Was this page helpful?"
  yes_label: "Yes"
  no_label: "No"
  thank_you: "Thank you for your feedback!"


# Build settings
sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
