# Zero-Dark CI/CD Pipeline
# Architecture: Ruby Gem Workflow + GitLab Pages + Cloudflare Pages
# Image: sgkens/phellams-automator : https://hub.docker.com/r/sgkens/phellams-automator

image: sgkens/phellams-automator:${AUTOMATOR_VERSION}


variables:
  JEKYLL_ENV: production
  LC_ALL: C.UTF-8
  GEM_NAME: "jekyll-theme-zero-dark"
  BUNDLE_SILENCE_ROOT_WARNING: "1"
  BUNDLE_PATH: "vendor/bundle"
  GIT_DEPTH: "0"

cache:
  paths:
    - vendor/bundle

before_script:
  - if command -v apt-get >/dev/null; then apt-get update && apt-get install -y ruby-dev build-essential; elif command -v apk >/dev/null; then apk add --no-cache ruby-dev build-base; fi
  - bundle config set --local path 'vendor/bundle'
  - bundle install -j $(nproc)

stages:
  - test
  - build
  - deploy
  - release

# ____________________________________________________________
# ########| @Define job templates for reuse (via YAML anchors)

.test_build: &test_build
  tags:
    - docker
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      when: on_success
      #?NOTE: gitlab supports REGEX RE2 regular expression engine
      # - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|preview|prerelease)(?:\.\d+[a-z]*)?)?(?:\+[a-zA-Z0-9-.]+)?$/
      #   when: always

.build_template: &build_template
  stage: deploy
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: always
    # - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|preview|prerelease)(?:\.\d+[a-z]*)?)?(?:\+[a-zA-Z0-9-.]+)?$/
    #   when: always

.deploy_template: &deploy_template
  stage: deploy
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|preview|prerelease)(?:\.\d+[a-z]*)?)?(?:\+[a-zA-Z0-9-.]+)?$/
      when: on_success

.release_template: &release_template
  stage: release
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|preview|prerelease)(?:\.\d+[a-z]*)?)?(?:\+[a-zA-Z0-9-.]+)?$/
      when: on_success

# 1. 🧪 TEST STAGE
# Ensures the code builds without errors and lints the HTML.
test_build:
  <<: *test_build
  script:
    - echo "🔍 Starting Zero-Dark Diagnostic..."
    - bundle exec jekyll build --strict_front_matter --future
    - echo "✅ Build Verification Complete."

# 2. 📦 BUILD STAGE
# Compiles the actual Ruby Gem (*.gem) file for distribution.
# note: we should also save the gem file to the Generic Asset Registory
build_gem:
  <<: *build_template
  before_script: []
  script:
    - echo "💎 Building Zero-Dark Gem..."
    - gem build $GEM_NAME.gemspec
    - mkdir build_artifacts
    - mv *.gem build_artifacts/
  artifacts:
    paths:
      - build_artifacts/
    expire_in: 1 week

# 3. 🚀 DEPLOY STAGE (Cloudflare Pages) we Will deploy to cloud flare using wrangler
cloudflare_pages:
  <<: *build_template
  script:
    # - echo "🌑 Deploying Platinum Master to Pages..."
    # - bundle exec jekyll build -d public
    - echo "🌑 Deploying Platinum Master to Cloudflare Static Pages..."
    - echo "🌑 bundle exec jekyll build -d public"
    - bundle exec jekyll build -d public
    - echo "🌑 wrangler pages publish ./public --branch main"
    - npm install -g wrangler
    - npx wrangler pages publish ./public --branch main
  artifacts:
    paths:
      - public

# 4. 🏷️ RELEASE STAGE
# Triggers only when a tag (e.g., v3.0.0) is pushed.
# 1. Pushes the Gem to the GitLab Package Registry.
# 2. Creates a formal GitLab Release entry with ZIP asset.
publish_release:
  <<: *release_template
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script:
    - apk add --no-cache ruby ruby-dev build-base zip curl
  script:
    # Publish to GitLab Package Registry
    - echo "🚀 Publishing $GEM_NAME $CI_COMMIT_TAG to Registry..."
    - mkdir -p ~/.gem
    - |
      echo "---
      :backtrace: false
      :bulk_threshold: 1000
      :sources:
      - https://rubygems.org/
      - https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/rubygems/
      :update_sources: true
      :verbose: true" > ~/.gemrc
    - gem build $GEM_NAME.gemspec
    - gem push *.gem --host https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/rubygems/

    # Package the repository into a direct-use ZIP asset
    - echo "📦 Packaging Zero-Dark to jekyll-theme-zero-dark-$CI_COMMIT_TAG.zip..."
    - zip -r jekyll-theme-zero-dark-$CI_COMMIT_TAG.zip . -x "node_modules/*" -x ".git/*" -x ".jekyll-cache/*" -x "_site/*" -x "vendor/*" -x "docs/_site/*" -x "docs/.jekyll-cache/*"

    # Upload ZIP to GitLab Generic Packages Registry
    - echo "🚀 Uploading ZIP package to Generic Packages Registry..."
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file jekyll-theme-zero-dark-$CI_COMMIT_TAG.zip \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jekyll-theme-zero-dark/${CI_COMMIT_TAG}/jekyll-theme-zero-dark-${CI_COMMIT_TAG}.zip"

    # Create Git Release
    - echo "📝 Generating Release Notes..."
    - |
      release-cli create --name "Zero-Dark $CI_COMMIT_TAG" \
                         --description "Platinum Master Release $CI_COMMIT_TAG" \
                         --tag-name $CI_COMMIT_TAG \
                         --assets-link "{\"name\":\"Download ZIP\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jekyll-theme-zero-dark/${CI_COMMIT_TAG}/jekyll-theme-zero-dark-${CI_COMMIT_TAG}.zip\"}"