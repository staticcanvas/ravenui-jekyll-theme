# 🖤 ZeroDark CI/CD Pipeline
# Architecture: Ruby Gem Workflow + GitLab Pages
# Image: Official Ruby 3.2 (Optimized for Jekyll)

image: ruby:3.2

variables:
  JEKYLL_ENV: production
  LC_ALL: C.UTF-8
  GEM_NAME: "zero-dark-sp"

cache:
  paths:
    - vendor/bundle

stages:
  - test
  - build
  - deploy
  - release

before_script:
  - gem install bundler
  - bundle config set --local path 'vendor/bundle'
  - bundle install --jobs=4 --retry=3

# 1. 🧪 TEST STAGE
# Ensures the code builds without errors and lints the HTML.
test_build:
  stage: test
  script:
    - echo "🔍 Starting ZeroDark Diagnostic..."
    - bundle exec jekyll build --strict_front_matter --future
    - echo "✅ Build Verification Complete."
  except:
    - tags

# 2. 📦 BUILD STAGE
# Compiles the actual Ruby Gem (*.gem) file for distribution.
build_gem:
  stage: build
  script:
    - echo "💎 Building ZeroDark Gem..."
    - gem build $GEM_NAME.gemspec
    - mkdir build_artifacts
    - mv *.gem build_artifacts/
  artifacts:
    paths:
      - build_artifacts/
    expire_in: 1 week

# 3. 🚀 DEPLOY STAGE (GitLab Pages)
# Deploys the Platinum Master Documentation to GitLab Pages.
pages:
  stage: deploy
  script:
    - echo "🌑 Deploying Platinum Master to Pages..."
    - bundle exec jekyll build -d public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# 4. 🏷️ RELEASE STAGE
# Triggers only when a tag (e.g., v3.0.0) is pushed.
# 1. Pushes the Gem to the GitLab Package Registry.
# 2. Creates a formal GitLab Release entry with ZIP asset.
publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache ruby ruby-dev build-base zip curl
  script:
    # Publish to GitLab Package Registry
    - echo "🚀 Publishing $GEM_NAME $CI_COMMIT_TAG to Registry..."
    - mkdir -p ~/.gem
    - |
      echo "---
      :backtrace: false
      :bulk_threshold: 1000
      :sources:
      - https://rubygems.org/
      - https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/rubygems/
      :update_sources: true
      :verbose: true" > ~/.gemrc
    - gem build $GEM_NAME.gemspec
    - gem push *.gem --host https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/rubygems/

    # Package the repository into a direct-use ZIP asset
    - echo "📦 Packaging ZeroDark SP to zero-dark-sp-$CI_COMMIT_TAG.zip..."
    - zip -r zero-dark-sp-$CI_COMMIT_TAG.zip . -x "node_modules/*" -x ".git/*" -x ".jekyll-cache/*" -x "_site/*" -x "vendor/*" -x "docs/_site/*" -x "docs/.jekyll-cache/*"

    # Upload ZIP to GitLab Generic Packages Registry
    - echo "🚀 Uploading ZIP package to Generic Packages Registry..."
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file zero-dark-sp-$CI_COMMIT_TAG.zip \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zero-dark-sp/${CI_COMMIT_TAG}/zero-dark-sp-${CI_COMMIT_TAG}.zip"

    # Create Git Release
    - echo "📝 Generating Release Notes..."
    - |
      release-cli create --name "ZeroDark $CI_COMMIT_TAG" \
                         --description "Platinum Master Release $CI_COMMIT_TAG" \
                         --tag-name $CI_COMMIT_TAG \
                         --assets-link "{\"name\":\"Download ZIP\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zero-dark-sp/${CI_COMMIT_TAG}/zero-dark-sp-${CI_COMMIT_TAG}.zip\"}"