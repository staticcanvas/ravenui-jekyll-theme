# 🌑 ZERO-DARK - Configuration Reference
# This file contains all available configuration settings for the theme.
# Settings that are optional or not required for the default docs site are commented out.

# --- Core Identity ---------------------------------------------------------
title: Zero-Dark Documentation
description: Official documentation for the Zero-Dark Jekyll theme.
logo_text: ZERODARK
logo_subtext: DOCS
copyright: "© 2026 StaticCanvas. All rights reserved."

# --- Theme Engine ----------------------------------------------------------\
theme: jekyll-theme-zero-dark

# --- Navigation & Base -----------------------------------------------------\
url: "" 
baseurl: "/"

# --- Advanced Theme Settings -----------------------------------------------\
theme_settings:
  # Branding
  logo:
    path: /logo.svg                 # Path to image logo in sidebar
    alt: Zero-Dark                # Alt text for logo
    height: 40px                    # Visual height of logo (px) 
    layout: split                  # Layout type for sidebar branding (options: inline, stacked, split)
  # favicon:
  #   path: /favicon.ico
  #   height: 32px

  # Interface
  scroll_progress: true             # Toggle global reading progress bar
  header:
    enabled: false
    sticky: true
    align: center                   # Alignment of header links (options: left, center, right)
  toc:
    style: nodes                   # TOC style design: simple, lines, nodes
    density: default               # TOC density: compact, default, relaxed
    animations: true               # Enable/disable TOC specific animations (page load, hover)
  code:
    lang_style: header              # Code block language style: badge, header

  # Search Configuration
  search:
    provider: pagefind            # options: pagefind, lyra, algolia
    use_cdn: true                 # load search library assets via CDN vs local files
    algolia:
      app_id: "your_app_id"
      api_key: "your_search_only_api_key"
      index_name: "your_index_name"
  zd_toc_default_open: true         # Should TOC be open by default on desktop?

  # Animations Controls
  animations:
    enabled: true                   # Enable/disable all animations globally
    page_loads: true                # Enable subtle page load fade-in animations
    hover_effects: true             # Enable hover scale/rotate micro-animations on interactive elements

  # Typography Configurations
  typography:
    google_fonts: "Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@500"
    font_sans: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font_mono: "'MonaspiceAr Nerd Font Mono', 'JetBrains Mono', 'Fira Code', monospace"
    h1:
      font_family: "'Fraunces', serif"
      weight: "400"
    h2:
      font_family: "'Fraunces', serif"
      weight: "500"
    h3:
      font_family: "'IBM Plex Sans', sans-serif"
      weight: "500"
    body:
      weight: "400"

  # Dynamic Footer Layout (2 or 3 columns)
  footer:
    columns:
      - title: "Documentation"
        items:
          - type: link
            text: "Introduction"
            url: "/"
            icon: "home"
          - type: link
            text: "Installation"
            url: "/installation/"
            icon: "download"
          - type: link
            text: "Advanced Installation"
            url: "/installation/advanced/"
            icon: "settings"
      - title: "Components"
        items:
          - type: link
            text: "Gallery"
            url: "/components/"
            icon: "package"
          - type: link
            text: "Liquid IRL"
            url: "/liquid-irl/"
            icon: "code"
          - type: link
            text: "Theme Colors"
            url: "/theme-colors/"
            icon: "palette"
      - title: "Project"
        items:
          - type: text
            text: "Zero-Dark is an elegant Jekyll theme designed for technical documentations and developers."
          - type: icon
            icon: "github"
            url: "https://github.com/staticcanvas"
          - type: icon
            icon: "linkedin"
            url: "https://linkedin.com/in/staticcanvas"

# --- Feature Toggles -------------------------------------------------------\
zd_output_title_default: true       # Render H1 and tags at top of page?
zd_toc_levels: ["h2", "h3", "h4"]   # HTML headers to include in TOC (e.g. ["h2", "h3", "h4"])
zd_progress_bar: true               # Legacy toggle for progress bar (use theme_settings.scroll_progress)
zd_code_copy: true                  # Enable 'COPY' button on code blocks
zd_code_lang: true                  # Show language label on code blocks
font_awesome: true                  # Enable Font Awesome icons

# --- Visual Defaults -------------------------------------------------------\
zd_icon_size: 16                    # Default size for icons in nav/includes
zd_accent_color: "#00ff9d"          # Primary theme accent color
zd_nav_spacing: compact             # Spacing for navigation items (options: compact, relaxed)
zd_heading_spacing: relaxed         # Spacing for headings (options: relaxed, tight)

# --- Debug & Development ---------------------------------------------------\
zd_debug: true                      # Enable debug mode for development (shows warnings in console)
zd_show_version: true               # Show version tag in the sidebar logo section
version: 1.16.6                     # Current version of the project/docs

# --- Social Integration (Sidebar) ------------------------------------------\
github_username: staticcanvas
gitlab_username: staticcanvas
twitter_username: staticcanvas
linkedin_username: staticcanvas
bluesky_username: staticcanvas

# --- Announcement Banner Settings ------------------------------------------\
zd_announcement:
  enabled: true
  id: "welcome-banner-v1"
  text: "Welcome to Zero-Dark! Check out the new Keyboard Shortcuts component."
  icon: "megaphone"
  color: "var(--zd-clr-viridian)"
  link: "/components/kbd/"
  link_text: "View Docs"
  dismissible: true
  type: "success"

# --- Feedback Widget Settings ---------------------------------------------\
zd_feedback:
  enabled: true
  question: "Was this page helpful?"
  yes_label: "Yes"
  no_label: "No"
  thank_you: "Thank you for your feedback!"

# --- Documentation Meta (Edit Links) --------------------------------------\
github_repo: zero-dark-jekyll-theme
github_repo_url: https://github.com/staticcanvas/zero-dark-jekyll-theme
github_branch: main
# gitlab_repo: zero-dark-jekyll-theme
# gitlab_repo_url: https://gitlab.com/staticcanvas/zero-dark-jekyll-theme
# gitlab_branch: main

# --- Build Settings --------------------------------------------------------\
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
      start_line: 1

sass:
  sass_dir: _sass
  style: compressed

# --- Plugins ---------------------------------------------------------------\
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
