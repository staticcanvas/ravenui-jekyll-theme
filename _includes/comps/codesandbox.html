{% assign id = include.id %}
{% assign height = include.height | default: 500 %}
{% assign theme = include.theme | default: "dark" %}
{% assign view = include.view | default: "preview" %}
{% assign title = include.title | default: "CodeSandbox Embed" %}

{% if id %}
<div class="zd-codesandbox-container {{ include.class }}" style="height: {{ height }}px;">
  <iframe 
    src="https://codesandbox.io/embed/{{ id }}?fontsize=14&hidenavigation=1&theme={{ theme }}&view={{ view }}"
    style="width: 100%; height: {{ height }}px; border: none; overflow: hidden;"
    title="{{ title | escape }}"
    allow="accelerometer; ambient-light-sensor; camera; encrypted-media; geolocation; gyroscope; hid; microphone; midi; payment; usb; vr; xr-spatial-tracking"
    sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"
    loading="lazy">
  </iframe>
</div>
{% endif %}
