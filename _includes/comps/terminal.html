<div class="rd-terminal">
    <div class="rd-terminal-header">
        <div class="rd-terminal-dots">
            <span class="rd-terminal-dot rd-terminal-dot--red"></span>
            <span class="rd-terminal-dot rd-terminal-dot--yellow"></span>
            <span class="rd-terminal-dot rd-terminal-dot--green"></span>
        </div>
        <div class="rd-terminal-title">{{ include.title | default: "bash" }}</div>
    </div>
    <div class="rd-terminal-body">
        {{ include.content }}
    </div>
</div>
