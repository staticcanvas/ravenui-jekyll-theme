<div class="rd-callout rd-callout--{{ include.type | default: 'note' }} {% if include.inline %}rd-callout--inline{% endif %}">
    <span class="rd-callout-title">
        {% case include.type %}
            {% when 'success' %}
                <i data-lucide="check-circle" style="width: 14px; height: 14px;"></i>
            {% when 'warn' %}
                <i data-lucide="alert-triangle" style="width: 14px; height: 14px;"></i>
            {% when 'danger' %}
                <i data-lucide="alert-circle" style="width: 14px; height: 14px;"></i>
            {% else %}
                <i data-lucide="info" style="width: 14px; height: 14px;"></i>
        {% endcase %}
        {{ include.title | default: include.type | capitalize }}
    </span>
    <div class="rd-callout-content">
        {{ include.content }}
    </div>
</div>
