<details class="zd-faq-item {{ include.class }}">
    <summary class="zd-faq-question">
        <span class="zd-faq-icon">{% include comps/icon.html name="help-circle" size=14 %}</span>
        {{ include.question | default: "Question?" }}
        <span class="zd-faq-arrow">{% include comps/icon.html name="chevron-down" size=12 %}</span>
    </summary>
    <div class="zd-faq-answer">
        {{ include.answer | default: include.content }}
    </div>
</details>
