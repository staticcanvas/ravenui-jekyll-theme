{%- comment -%}
Component__: Back to Top Button
Purpose____: Floating button that scrolls the page back to the top when clicked.
Usage______: {% include comps/back-to-top.html %}
{%- endcomment -%}

<button id="rd-back-to-top" class="rd-back-to-top" aria-label="Back to Top">
  {% include comps/icon.html name="chevron-up" size="18" %}
</button>

<script>
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('rd-back-to-top');
    if (!btn) return;

    window.addEventListener('scroll', function() {
      if (window.scrollY > 300) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }, { passive: true });

    btn.addEventListener('click', function() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  });
})();
</script>
