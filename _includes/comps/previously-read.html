<div class="rd-previously-read {{ include.class }}" id="rd-previously-read-container">
  <div class="rd-previously-read-empty">
    {% include comps/icon.html name="history" size=14 %}
    <span>No history found. Pages you read will appear here.</span>
  </div>
  <ul class="rd-previously-read-list" style="display: none;"></ul>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('rd-previously-read-container');
    if (!container) return;
    const emptyMsg = container.querySelector('.rd-previously-read-empty');
    const list = container.querySelector('.rd-previously-read-list');
    
    try {
      const visited = JSON.parse(localStorage.getItem('rd_visited_pages') || '[]');
      if (visited.length > 0) {
        emptyMsg.style.display = 'none';
        list.style.display = 'flex';
        list.innerHTML = ''; // Clear fallback
        
        // Render unique visited pages, sorted by timestamp desc
        const uniqueVisited = [];
        const seen = new Set();
        
        for (const item of visited) {
          // Normalize URL paths to avoid duplicate trailing slash issues
          const normUrl = item.url.replace(/\/$/, "");
          if (!seen.has(normUrl)) {
            seen.add(normUrl);
            uniqueVisited.push(item);
          }
        }
        
        // Limit display list to the last 6 read pages
        uniqueVisited.slice(0, 6).forEach(item => {
          const li = document.createElement('li');
          li.className = 'rd-previously-read-item';
          
          const a = document.createElement('a');
          a.href = item.url;
          a.className = 'rd-previously-read-link';
          
          const titleText = document.createElement('span');
          titleText.className = 'rd-previously-read-title';
          // Clean title suffix if standard " - RavenUI" is present
          titleText.textContent = item.title.replace(/\s*-\s*RavenUI\s*$/i, '');
          
          const iconSpan = document.createElement('span');
          iconSpan.className = 'rd-previously-read-item-icon';
          iconSpan.innerHTML = '<i data-lucide="check-circle-2" style="width: 12px; height: 12px; color: var(--rd-clr-highlight, #00ff9d);"></i>';
          
          a.appendChild(iconSpan);
          a.appendChild(titleText);
          li.appendChild(a);
          list.appendChild(li);
        });

        // Re-trigger Lucide icon generation for dynamically inserted icons
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }
    } catch (e) {
      console.warn("Failed to load previously read history:", e);
    }
  });
</script>
