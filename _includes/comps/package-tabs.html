<div class="zd-tabs" id="{{ include.id | default: 'tabs' }}">
    <div class="zd-tabs-header">
        <button class="zd-tab-btn active" data-tab="npm">npm</button>
        <button class="zd-tab-btn" data-tab="yarn">yarn</button>
        <button class="zd-tab-btn" data-tab="pnpm">pnpm</button>
    </div>
    <div class="zd-tabs-content">
        <div class="zd-tab-pane active" data-pane="npm">
            <pre><code>npm install {{ include.package }}</code></pre>
        </div>
        <div class="zd-tab-pane" data-pane="yarn">
            <pre><code>yarn add {{ include.package }}</code></pre>
        </div>
        <div class="zd-tab-pane" data-pane="pnpm">
            <pre><code>pnpm add {{ include.package }}</code></pre>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('{{ include.id | default: "tabs" }}');
    if (!container) return;
    
    const buttons = container.querySelectorAll('.zd-tab-btn');
    const panes = container.querySelectorAll('.zd-tab-pane');

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-tab');
            buttons.forEach(b => b.classList.remove('active'));
            panes.forEach(p => p.classList.remove('active'));
            
            btn.classList.add('active');
            container.querySelector(`[data-pane="${tab}"]`).classList.add('active');
        });
    });
});
</script>
