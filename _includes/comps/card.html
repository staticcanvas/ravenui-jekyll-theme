<div class="rd-card {% if include.glass %}rd-card--glass{% endif %} {{ include.class }}">
    {% if include.icon %}
    <div class="rd-card-icon">{% include comps/icon.html name=include.icon size=24 color=include.icon_color %}</div>
    {% endif %}
    {% if include.title %}
    <h4 class="rd-card-title">{{ include.title }}</h4>
    {% endif %}
    <div class="rd-card-content">
        {{ include.content }}
    </div>
</div>
