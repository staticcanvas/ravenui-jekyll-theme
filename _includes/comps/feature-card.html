<div class="rd-feature-card">
    <div class="rd-feature-card-icon" style="color: {{ include.color | default: 'var(--rd-clr-highlight)' }};">
        {% include comps/icon.html name=include.icon size=32 %}
    </div>
    <h4 class="rd-feature-card-title">{{ include.title }}</h4>
    <p class="rd-feature-card-desc">{{ include.description }}</p>
</div>
